# KT-BOT Docker Compose Configuration
# Complete stack: Application + Ollama + PostgreSQL + Redis

version: '3.8'

services:
  # KT-BOT Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kt-bot:latest
    container_name: ktbot-app
    ports:
      - "7860:7860"  # FastAPI
      - "7861:7861"  # Gradio
    environment:
      # Application
      - ENVIRONMENT=development
      - DEBUG=true
      - APP_VERSION=0.3.0

      # Database
      - DATABASE_URL=postgresql+asyncpg://ktbot:ktbot_password@postgres:5432/ktbot
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20

      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_TTL=1800

      # Ollama
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text:latest

      # RAG Configuration
      - CHROMA_HOST=localhost
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION=ktbot_documents

      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/ktbot.log

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - ktbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Ollama Service - LLM Backend
  ollama:
    image: ollama/ollama:latest
    container_name: ktbot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    networks:
      - ktbot-network
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: ktbot-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ktbot
      - POSTGRES_USER=ktbot
      - POSTGRES_PASSWORD=ktbot_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - ktbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ktbot-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ktbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: ktbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - ktbot-network
    profiles:
      - production

volumes:
  ollama_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ktbot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
