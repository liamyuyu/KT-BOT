# KT-BOT Production Docker Compose Configuration
# ==============================================================================
# This file contains production-optimized settings for deploying KT-BOT
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Before deploying:
#   1. Copy .env.example to .env.prod and configure all values
#   2. Generate strong secrets for passwords and tokens
#   3. Configure SSL certificates in nginx/ssl/
#   4. Review resource limits based on your infrastructure
#
# For detailed deployment guide, see docs/DEPLOYMENT.md
# ==============================================================================

version: '3.8'

services:
  # ===========================================================================
  # KT-BOT Application - Main Service
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
    image: ktbot:${APP_VERSION:-0.3.0}
    container_name: ktbot-app
    restart: always
    ports:
      - "${APP_PORT:-7860}:7860"    # FastAPI backend
      - "${GRADIO_PORT:-7861}:7861" # Gradio frontend
    env_file:
      - .env.prod
    environment:
      # Override specific production settings
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO

      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0

      # Ollama
      - OLLAMA_BASE_URL=http://ollama:11434

    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_uploads:/app/data/uploads
      - app_chroma:/app/data/chroma_db
      - app_bm25_cache:/app/data/bm25_cache
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - ktbot-network
    deploy:
      resources:
        limits:
          cpus: '${CONTAINER_CPU_LIMIT:-2.0}'
          memory: ${CONTAINER_MEMORY_LIMIT:-2g}
        reservations:
          cpus: '${CONTAINER_CPU_RESERVATION:-0.5}'
          memory: ${CONTAINER_MEMORY_RESERVATION:-1g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=ktbot-app"

  # ===========================================================================
  # Ollama - LLM Backend
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ktbot-ollama
    restart: always
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
    networks:
      - ktbot-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8g
        reservations:
          cpus: '2.0'
          memory: 4g
    # Uncomment for NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # PostgreSQL Database - Primary Data Store
  # ===========================================================================
  postgres:
    image: postgres:14-alpine
    container_name: ktbot-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
      - PGDATA=/var/lib/postgresql/data/pgdata
      # Performance tuning
      - POSTGRES_SHARED_BUFFERS=256MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=1GB
      - POSTGRES_MAINTENANCE_WORK_MEM=128MB
      - POSTGRES_WORK_MEM=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_backups:/backups
    networks:
      - ktbot-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1g
        reservations:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c work_mem=16MB
      -c max_connections=200
      -c log_min_duration_statement=1000

  # ===========================================================================
  # Redis - Cache & Session Store
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ktbot-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --timeout 300
      --tcp-keepalive 60
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
      - redis_backups:/backups
    networks:
      - ktbot-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ===========================================================================
  # Nginx - Reverse Proxy & SSL Termination
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: ktbot-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app
    networks:
      - ktbot-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256m
        reservations:
          cpus: '0.25'
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # Prometheus - Metrics Collection (Optional)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ktbot-prometheus
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - ktbot-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m
    profiles:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ===========================================================================
  # Grafana - Metrics Visualization (Optional)
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ktbot-grafana
    restart: always
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - ktbot-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m
    profiles:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# =============================================================================
# Named Volumes - Data Persistence
# =============================================================================
volumes:
  # Application data
  app_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data

  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs

  app_uploads:
    driver: local

  app_chroma:
    driver: local

  app_bm25_cache:
    driver: local

  # Ollama models
  ollama_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/ollama

  # PostgreSQL data
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres

  postgres_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./backups/postgres

  # Redis data
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis

  redis_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./backups/redis

  # Nginx cache
  nginx_cache:
    driver: local

  # Monitoring
  prometheus_data:
    driver: local

  grafana_data:
    driver: local

# =============================================================================
# Networks - Service Communication
# =============================================================================
networks:
  ktbot-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
    driver_opts:
      com.docker.network.bridge.name: br-ktbot
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.driver.mtu: "1500"
