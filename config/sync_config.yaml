# 数据同步配置文件
# 用于配置 Jira 和 Confluence 的自动同步策略

# Jira 同步配置
jira:
  # 是否启用自动同步
  enabled: true

  # 调度类型: cron | interval
  # - cron: 使用 Cron 表达式（适合固定时间点同步）
  # - interval: 使用时间间隔（适合周期性同步）
  schedule_type: cron

  # 调度值
  # - cron 格式: "分 时 日 月 周" (标准 Cron 表达式)
  #   示例: "0 */6 * * *" 表示每6小时的整点执行
  # - interval 格式: 秒数（字符串）
  #   示例: "21600" 表示每6小时（21600秒）
  schedule_value: "0 */6 * * *"

  # 是否增量同步
  # - true: 只同步上次同步时间之后更新的数据
  # - false: 全量同步所有数据
  incremental: true

  # 批量处理大小
  # 每批次获取和处理的 Issue 数量
  # 建议值: 30-100（根据 API 限流和服务器性能调整）
  batch_size: 50

  # 重试次数
  # 同步失败后的最大重试次数
  retry_attempts: 3

  # 重试延迟（秒）
  # 每次重试前的等待时间
  retry_delay: 60

  # 额外参数（可选）
  extra_params:
    # JQL 查询条件（可选）
    # 示例: "project = PROJ AND status != Closed"
    jql: null

    # 是否同步附件（可选）
    sync_attachments: false

    # 是否同步评论（可选）
    sync_comments: true


# Confluence 同步配置
confluence:
  # 是否启用自动同步
  enabled: true

  # 调度类型: cron | interval
  schedule_type: interval

  # 调度值
  # 每6小时同步一次（21600秒 = 6小时）
  schedule_value: "21600"

  # 是否增量同步
  incremental: true

  # 批量处理大小
  # 每批次获取和处理的 Page 数量
  batch_size: 30

  # 重试次数
  retry_attempts: 3

  # 重试延迟（秒）
  retry_delay: 60

  # 额外参数（可选）
  extra_params:
    # CQL 查询条件（可选）
    # 示例: "space = DEV AND type = page"
    cql: null

    # 是否同步附件（可选）
    sync_attachments: false

    # 是否同步子页面（可选）
    sync_children: true


# ============================================================================
# 调度配置说明
# ============================================================================
#
# 1. Cron 表达式格式:
#    分钟 小时 日 月 星期
#    * * * * *
#
#    示例:
#    - "0 */6 * * *"    每6小时的整点执行（00:00, 06:00, 12:00, 18:00）
#    - "0 9,17 * * *"   每天 09:00 和 17:00 执行
#    - "0 2 * * 0"      每周日凌晨 02:00 执行
#    - "30 8-18 * * 1-5" 工作日每天 08:30-18:30 每小时执行
#
# 2. Interval 格式:
#    时间间隔（秒数）
#
#    示例:
#    - "3600"    每1小时
#    - "21600"   每6小时
#    - "43200"   每12小时
#    - "86400"   每24小时
#
# 3. 增量同步 vs 全量同步:
#    - 增量同步: 只同步上次同步后更新的数据（推荐）
#      优点: 速度快，节省资源
#      适用场景: 日常定时同步
#
#    - 全量同步: 同步所有数据
#      优点: 数据完整
#      适用场景: 首次同步、数据修复
#
# 4. 批量大小建议:
#    - Jira: 30-100（取决于 Issue 复杂度）
#    - Confluence: 20-50（取决于 Page 大小）
#
#    注意: 批量大小过大可能导致:
#    - API 超时
#    - 内存占用过高
#    - 超过 API 速率限制
#
# 5. 重试策略:
#    - retry_attempts: 建议 3-5 次
#    - retry_delay: 建议 60-300 秒
#
#    重试场景:
#    - 网络临时故障
#    - API 速率限制
#    - 服务端暂时不可用
#
# ============================================================================
