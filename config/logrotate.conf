# KT-BOT Log Rotation Configuration
# Place in /etc/logrotate.d/ktbot in production

/app/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    notifempty
    create 0640 ktbot ktbot
    sharedscripts
    postrotate
        # Reload application to reopen log files
        docker-compose exec app kill -USR1 1 2>/dev/null || true
    endscript
}

/var/log/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data www-data
    sharedscripts
    postrotate
        docker-compose exec nginx nginx -s reopen 2>/dev/null || true
    endscript
}
