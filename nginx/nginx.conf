# ==============================================================================
# KT-BOT Nginx Configuration
# ==============================================================================
# Production-ready reverse proxy configuration with SSL, security headers,
# rate limiting, and caching.
#
# Before using:
#   1. Replace ktbot.example.com with your domain
#   2. Place SSL certificates in nginx/ssl/
#   3. Adjust rate limits and caching based on your needs
#
# For more information, see docs/DEPLOYMENT.md
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ===========================================================================
    # Logging Configuration
    # ===========================================================================
    log_format main '\$remote_addr - \$remote_user [\$time_local] "\$request" '
                    '\$status \$body_bytes_sent "\$http_referer" '
                    '"\$http_user_agent" "\$http_x_forwarded_for" '
                    'rt=\$request_time uct="\$upstream_connect_time" '
                    'uht="\$upstream_header_time" urt="\$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ===========================================================================
    # Performance Settings
    # ===========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer settings
    client_body_buffer_size 128k;
    client_max_body_size 100m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ===========================================================================
    # Gzip Compression
    # ===========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ===========================================================================
    # Rate Limiting
    # ===========================================================================
    limit_req_zone \$binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone \$binary_remote_addr zone=chat_limit:10m rate=20r/m;
    limit_req_zone \$binary_remote_addr zone=upload_limit:10m rate=10r/m;
    limit_conn_zone \$binary_remote_addr zone=conn_limit:10m;

    # ===========================================================================
    # Cache Configuration
    # ===========================================================================
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m
                     max_size=1g inactive=60m use_temp_path=off;

    # ===========================================================================
    # Upstream Configuration
    # ===========================================================================
    upstream ktbot_backend {
        least_conn;
        server app:7860 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ktbot_gradio {
        least_conn;
        server app:7861 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ===========================================================================
    # HTTP Server - Redirect to HTTPS
    # ===========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name ktbot.example.com www.ktbot.example.com;

        # Health check endpoint (accessible via HTTP)
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Let's Encrypt challenge
        location ^~ /.well-known/acme-challenge/ {
            default_type "text/plain";
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://\$server_name\$request_uri;
        }
    }

    # ===========================================================================
    # HTTPS Server - Main Configuration
    # ===========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ktbot.example.com;

        # ========================================================================
        # SSL Configuration
        # ========================================================================
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL protocols and ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # SSL optimization
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ========================================================================
        # Security Headers
        # ========================================================================
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ========================================================================
        # Health Check Endpoint
        # ========================================================================
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ========================================================================
        # API Endpoints - FastAPI Backend
        # ========================================================================
        location /api/ {
            # Rate limiting
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;

            # Proxy settings
            proxy_pass http://ktbot_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \$http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;

            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # ========================================================================
        # Chat Streaming Endpoint - Server-Sent Events (SSE)
        # ========================================================================
        location /api/v1/chat/stream {
            # Stricter rate limiting for chat
            limit_req zone=chat_limit burst=5 nodelay;

            # Proxy settings for SSE
            proxy_pass http://ktbot_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;

            # SSE specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;

            # Headers for SSE
            add_header Cache-Control "no-cache";
            add_header X-Accel-Buffering "no";
        }

        # ========================================================================
        # File Upload Endpoint
        # ========================================================================
        location /api/v1/documents/upload {
            # Rate limiting for uploads
            limit_req zone=upload_limit burst=3 nodelay;

            # Proxy settings
            proxy_pass http://ktbot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;

            # Upload settings
            client_max_body_size 100m;
            client_body_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Disable buffering for large uploads
            proxy_request_buffering off;
        }

        # ========================================================================
        # Gradio Web Interface
        # ========================================================================
        location / {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Proxy settings
            proxy_pass http://ktbot_gradio;
            proxy_http_version 1.1;
            proxy_set_header Upgrade \$http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;

            # WebSocket support for Gradio
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        # ========================================================================
        # Deny Access to Hidden Files
        # ========================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
